# performance-* checks copies, moves and container operations; Padding flags avoidable record padding.
# Padding is a layout diagnostic; cache misses and false sharing still require runtime measurements.
Checks: '-*,custom-air-write-error,performance-*,clang-analyzer-optin.performance.Padding,bugprone-use-after-move,bugprone-dangling-handle,bugprone-return-const-ref-from-parameter,bugprone-forwarding-reference-overload,bugprone-unchecked-optional-access,cppcoreguidelines-missing-std-forward,cppcoreguidelines-rvalue-reference-param-not-moved,readability-redundant-control-flow,readability-container-contains,readability-use-std-min-max,readability-redundant-smartptr-get,readability-redundant-string-cstr,readability-redundant-member-init,modernize-*,-modernize-use-trailing-return-type,-modernize-avoid-c-arrays,-modernize-avoid-c-style-cast,modernize-use-scoped-lock'
CustomChecks:
  - Name: air-write-error
    Query: |
      match callExpr(
        callee(functionDecl(hasName("mullion::metallib::write"))),
        anyOf(hasParent(compoundStmt()),
              hasParent(cxxBindTemporaryExpr(hasParent(explicitCastExpr(hasType(voidType()))))),
              hasParent(exprWithCleanups(hasParent(compoundStmt()))),
              hasParent(cxxBindTemporaryExpr(hasParent(exprWithCleanups(hasParent(compoundStmt()))))))
      ).bind("call")
    Diagnostic:
      - BindName: call
        Message: 'Handle the AIR serialization error before publishing the compiled library.'
        Level: Warning
